[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeforge-v2"
version = "0.1.0"
description = "A small self-hosted inference optimization loop."
requires-python = ">=3.10"
dependencies = ["qwen-agent==0.0.34", "soundfile>=0.12", "tqdm>=4.65", "python-dateutil>=2.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
inference = ["torch>=2.5", "transformers>=4.51,<5", "safetensors", "accelerate"]

[project.scripts]
vibeforge-v2 = "vibeforge_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

