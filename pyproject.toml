[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeforge"
version = "0.1.0"
description = "Agent-driven generation and optimization of specialized inference engines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vibeforge = "vibeforge.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibeforge*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["target: real Qwen deployment; requires the configured inference environment and sufficient memory"]
